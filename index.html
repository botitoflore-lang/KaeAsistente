<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente Vaporeon</title>
    <style>
        body { 
            background: #121212; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        
        /* Área del Avatar */
        #header { 
            height: 40%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #1a1a1a;
            border-bottom: 2px solid #00bbff;
        }
        #avatar-container { 
            width: 180px; 
            height: 180px; 
            position: relative; 
        }
        #avatar-container img { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            display: none; 
            object-fit: contain; 
        }
        #img-A { display: block; } /* Mostrar el primero por defecto */

        /* Área del Chat */
        #chat-box { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 80%; line-height: 1.4; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .ai { align-self: flex-start; background: #333; color: white; }

        /* Input */
        #input-area { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            background: #1a1a1a; 
            border-top: 1px solid #333;
        }
        input { 
            flex-grow: 1; 
            padding: 12px; 
            border-radius: 25px; 
            border: 1px solid #444; 
            background: #222; 
            color: white; 
            outline: none;
        }
        button { 
            background: #00bbff; 
            color: black; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 25px; 
            font-weight: bold; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="header">
        <div id="avatar-container">
            <img id="img-A" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
            <img id="img-B" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
            <img id="img-C" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
            <img id="img-D" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
        </div>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Escribe un mensaje...">
        <button onclick="hablarConIA()">Enviar</button>
    </div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        // ⚠️ PEGA TU TOKEN AQUÍ ABAJO ⚠️
        const HF_TOKEN = "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"; 

        const imgA = document.getElementById('img-A'); // Abiertos / Cerrada
        const imgB = document.getElementById('img-B'); // Cerrados / Cerrada
        const imgC = document.getElementById('img-C'); // Abiertos / Abierta
        const imgD = document.getElementById('img-D'); // Cerrados / Abierta
        const sound = document.getElementById('typingSound');
        const chatBox = document.getElementById('chat-box');
        let estaHablando = false;

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        // Parpadeo automático cuando no habla
        setInterval(() => {
            if (!estaHablando) {
                ocultar(); imgB.style.display = 'block';
                setTimeout(() => { if(!estaHablando){ ocultar(); imgA.style.display = 'block'; } }, 200);
            }
        }, 4000);

        function animarVaporeon(duracion) {
            estaHablando = true;
            sound.play();
            let frame = 0;
            const intervalo = setInterval(() => {
                ocultar();
                // Alterna entre Boca Abierta (Ojos Abiertos e Ojos Cerrados)
                if (frame % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                frame++;
            }, 150);

            setTimeout(() => {
                clearInterval(intervalo);
                estaHablando = false;
                ocultar();
                imgA.style.display = 'block';
                sound.pause();
                sound.currentTime = 0;
            }, duracion);
        }

        function hablarConIA() {
    const input = document.getElementById('userInput');
    const texto = input.value;
    if (!texto) return;

    chatBox.innerHTML += `<div class="msg user">${texto}</div>`;
    input.value = "";
    
    // El Vaporeon responde algo fijo al instante
    setTimeout(() => {
        const respuesta = "¡Pura vaporeonada! No me rendiré si tú no te rindes.";
        chatBox.innerHTML += `<div class="msg ai">${respuesta}</div>`;
        animarVaporeon(3000); // Esto probará si tus imágenes cambian
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 500);
}
            try {
                const response = await fetch("https://api-inference.huggingface.co/models/facebook/blenderbot-400M-distill", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HF_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ inputs: texto })
                });

                const data = await response.json();
                
                // Blenderbot suele responder en 'generated_text'
                const respuestaIA = data.generated_text || (data[0] && data[0].generated_text) || "¡Hola! Estoy listo.";

                chatBox.innerHTML += `<div class="msg ai">${respuestaIA}</div>`;
                
                // Mueve la boca proporcionalmente a la respuesta
                animarVaporeon(respuestaIA.length * 60);
                
            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai">Ocurrió un error en la conexión.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enviar con la tecla Enter
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') hablarConIA();
        });
    </script>
</body>
</html>
