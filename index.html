<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vaporeon IA</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { height: 40%; display: flex; align-items: center; justify-content: center; background: #1a1a1a; border-bottom: 3px solid #00bbff; }
        #avatar-container { width: 180px; height: 180px; position: relative; }
        #avatar-container img { width: 100%; height: 100%; position: absolute; display: none; object-fit: contain; }
        #img-A { display: block; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 80%; }
        .user { align-self: flex-end; background: #007bff; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: #333; border-bottom-left-radius: 2px; }
        #input-area { padding: 15px; display: flex; gap: 10px; background: #1a1a1a; border-top: 1px solid #333; }
        input { flex-grow: 1; padding: 12px; border-radius: 25px; border: none; background: #252525; color: white; outline: none; }
        button { background: #00bbff; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="header">
        <div id="avatar-container">
            <img id="img-A" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
            <img id="img-B" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
            <img id="img-C" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
            <img id="img-D" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
        </div>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="¡Dime algo!">
        <button onclick="hablarConIA()">Enviar</button>
    </div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        const imgA = document.getElementById('img-A');
        const imgB = document.getElementById('img-B');
        const imgC = document.getElementById('img-C');
        const imgD = document.getElementById('img-D');
        const sound = document.getElementById('typingSound');
        const chatBox = document.getElementById('chat-box');
        let animando = false;

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        setInterval(() => {
            if (!animando) {
                ocultar(); imgB.style.display = 'block';
                setTimeout(() => { if(!animando){ ocultar(); imgA.style.display = 'block'; } }, 200);
            }
        }, 4000);

        function animarBoca(duracion) {
            animando = true;
            sound.play();
            let ciclo = 0;
            const intervalo = setInterval(() => {
                ocultar();
                if (ciclo % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                ciclo++;
            }, 150);
            setTimeout(() => {
                clearInterval(intervalo);
                animando = false;
                ocultar(); imgA.style.display = 'block';
                sound.pause(); sound.currentTime = 0;
            }, duracion);
        }

        // --- EL CEREBRO LOCAL (TÚ CONTROLAS LAS RESPUESTAS) ---
        function obtenerRespuesta(input) {
            input = input.toLowerCase();
            
            if (input.includes("hola") || input.includes("holi")) return "¡Hola! Soy tu asistente Vaporeon. ¿En qué puedo ayudarte hoy?";
            if (input.includes("quien eres") || input.includes("tu nombre")) return "¡Soy un Vaporeon programado por una persona increíble!";
            if (input.includes("como estas")) return "¡Estoy muy feliz de que por fin mi código funcione! Glub glub.";
            if (input.includes("te quiero")) return "¡Y yo a ti! Gracias por no rendirte conmigo. <3";
            if (input.includes("pokemon")) return "¡Los Vaporeon somos los mejores tipo agua!";
            if (input.includes("estás vivo")) return "Vivo en tu código, ¡así que técnicamente sí!";
            
            return "¡Glub! No estoy seguro de qué significa eso, pero suena interesante.";
        }

        function hablarConIA() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            chatBox.innerHTML += `<div class="msg user">${texto}</div>`;
            input.value = "";
            
            const respuestaIA = obtenerRespuesta(texto);

            setTimeout(() => {
                chatBox.innerHTML += `<div class="msg ai">${respuestaIA}</div>`;
                animarBoca(respuestaIA.length * 65);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') hablarConIA(); });
    </script>
</body>
</html>
