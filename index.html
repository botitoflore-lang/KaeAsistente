<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vaporeon IA</title>
    <style>
        body { 
            background: #121212; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        
        /* Contenedor del Avatar */
        #header { 
            height: 40%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #1a1a1a;
            border-bottom: 3px solid #00bbff;
        }
        #avatar-container { 
            width: 180px; 
            height: 180px; 
            position: relative; 
        }
        #avatar-container img { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            display: none; 
            object-fit: contain; 
        }
        #img-A { display: block; } /* Imagen inicial */

        /* Caja de Chat */
        #chat-box { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #121212;
        }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 80%; line-height: 1.4; font-size: 15px; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: #333; color: white; border-bottom-left-radius: 2px; }

        /* Área de escritura */
        #input-area { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            background: #1a1a1a; 
            border-top: 1px solid #333;
        }
        input { 
            flex-grow: 1; 
            padding: 12px 18px; 
            border-radius: 25px; 
            border: 1px solid #444; 
            background: #252525; 
            color: white; 
            outline: none;
        }
        button { 
            background: #00bbff; 
            color: #000; 
            border: none; 
            padding: 10px 22px; 
            border-radius: 25px; 
            font-weight: bold; 
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="header">
        <div id="avatar-container">
            <img id="img-A" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
            <img id="img-B" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
            <img id="img-C" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
            <img id="img-D" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
        </div>
    </div>

    <div id="chat-box" id="chatBox"></div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Dile algo a Vaporeon...">
        <button onclick="hablarConIA()">Enviar</button>
    </div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        const imgA = document.getElementById('img-A');
        const imgB = document.getElementById('img-B');
        const imgC = document.getElementById('img-C');
        const imgD = document.getElementById('img-D');
        const sound = document.getElementById('typingSound');
        const chatBox = document.getElementById('chat-box');
        let animando = false;

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        // Parpadeo automático (Ojos abiertos -> Ojos cerrados)
        setInterval(() => {
            if (!animando) {
                ocultar(); imgB.style.display = 'block';
                setTimeout(() => { if(!animando){ ocultar(); imgA.style.display = 'block'; } }, 200);
            }
        }, 4000);

        function animarBoca(duracion) {
            animando = true;
            sound.play();
            let ciclo = 0;
            const intervalo = setInterval(() => {
                ocultar();
                // Alterna entre Boca Abierta (Ojos abiertos / Ojos cerrados)
                if (ciclo % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                ciclo++;
            }, 150);

            setTimeout(() => {
                clearInterval(intervalo);
                animando = false;
                ocultar();
                imgA.style.display = 'block';
                sound.pause();
                sound.currentTime = 0;
            }, duracion);
        }

        async function hablarConIA() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            // Mostrar mensaje del usuario
            chatBox.innerHTML += `<div class="msg user">${texto}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            
            animarBoca(1500); // Mueve la boca mientras piensa

            try {
                // API gratuita de SimSimi (Habla español y no necesita Token)
                const response = await fetch(`https://api.simsimi.vn/v2/simsimi?text=${encodeURIComponent(texto)}&lc=es`);
                const data = await response.json();
                
                const respuestaIA = data.result || "¡Vaporeon! (No sé qué decir)";

                // Mostrar respuesta
                chatBox.innerHTML += `<div class="msg ai">${respuestaIA}</div>`;
                
                // Animar boca según el largo del texto
                animarBoca(respuestaIA.length * 60);
                
            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai">¡Glub! Hubo un error de conexión.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enviar con Enter
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') hablarConIA();
        });
    </script>
</body>
</html>
