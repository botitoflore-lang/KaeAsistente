<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi IA Privada</title>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Avatar */
        #header { height: 40%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e1e1e; }
        #avatar-container { width: 150px; height: 150px; position: relative; }
        #avatar-container img { width: 100%; height: 100%; position: absolute; display: none; object-fit: contain; }
        #img-A { display: block; } /* Reposo */

        /* Chat */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #121212; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; word-wrap: break-word; }
        .user { align-self: flex-end; background: #6200ee; }
        .ai { align-self: flex-start; background: #333; }

        /* Input */
        #input-area { padding: 15px; display: flex; gap: 10px; background: #1e1e1e; }
        input { flex-grow: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        button { background: #6200ee; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="header">
        <div id="avatar-container">
            <img id="img-A" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
            <img id="img-B" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
            <img id="img-C" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
            <img id="img-D" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
        </div>
    </div>

    <div id="chat-box" id="chatBox"></div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Escribe algo...">
        <button onclick="hablarConIA()">Enviar</button>
    </div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        const API_KEY = "AIzaSyCy3fzVLstJy56PPI2aa6D9UClzTfG50_Y"; // <--- PEGA TU LLAVE AQUÍ
        
        const imgA = document.getElementById('img-A');
        const imgB = document.getElementById('img-B');
        const imgC = document.getElementById('img-C');
        const imgD = document.getElementById('img-D');
        const sound = document.getElementById('typingSound');
        const chatBox = document.getElementById('chat-box');
        let animando = false;

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        // Animación de hablar
        function animarBoca(duracion) {
            animando = true;
            sound.play();
            let ciclo = 0;
            const interval = setInterval(() => {
                ocultar();
                if (ciclo % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                ciclo++;
            }, 150);
            
            setTimeout(() => {
                clearInterval(interval);
                animando = false;
                ocultar();
                imgA.style.display = 'block';
                sound.pause();
                sound.currentTime = 0;
            }, duracion);
        }

        async function hablarConIA() {
    const input = document.getElementById('userInput');
    const texto = input.value;
    if (!texto) return;

    // Mostrar mensaje del usuario
    chatBox.innerHTML += `<div class="msg user">${texto}</div>`;
    input.value = "";
    animarBoca(3000); // Mueve la boca mientras espera
    chatBox.scrollTop = chatBox.scrollHeight;


    try {
        // La línea de abajo es la clave. Asegúrate de que empiece y termine con `
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: texto }]
                }]
            })
        });
// ... sigue el resto del código

        const data = await response.json();

        // Si Google nos manda un error, lo mostramos para saber qué es
        if (data.error) {
            chatBox.innerHTML += `<div class="msg ai">Error de Google: ${data.error.message}</div>`;
        } else {
            const respuestaIA = data.candidates[0].content.parts[0].text;
            chatBox.innerHTML += `<div class="msg ai">${respuestaIA}</div>`;
            animarBoca(respuestaIA.length * 60); 
        }
    } catch (error) {
        chatBox.innerHTML += `<div class="msg ai">Error de red: ${error.message}</div>`;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}
        
    </script>
</body>
</html>
