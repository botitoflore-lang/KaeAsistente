<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vaporeon Virtual</title>
    <style>
        :root {
            --primary: #00d4ff;
            --bg: #0a192f;
            --chat-bg: #112240;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: white; font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; /* Evita rebotes raros en móvil */
        }

        /* Fondo de Burbujas */
        .ocean {
            position: fixed; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(180deg, #0a192f 0%, #001f3f 100%);
        }

        .bubble {
            position: absolute; bottom: -20px; background: rgba(255, 255, 255, 0.1);
            border-radius: 50%; animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-110vh) translateX(50px); opacity: 0; }
        }

        /* Contenedor Principal */
        .main-container {
            display: flex; flex-direction: column; height: 100vh;
        }

        /* Avatar */
        #header { 
            height: 35vh; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 1;
        }
        #avatar-container { width: 160px; height: 160px; position: relative; filter: drop-shadow(0 0 15px var(--primary)); }
        #avatar-container img { width: 100%; height: 100%; position: absolute; display: none; object-fit: contain; }
        #img-A { display: block; }

        /* Chat */
        #chat-box { 
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
            background: rgba(17, 34, 64, 0.8);
            border-radius: 25px 25px 0 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .msg { padding: 10px 16px; border-radius: 18px; max-width: 75%; font-size: 15px; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .user { align-self: flex-end; background: var(--primary); color: #000; font-weight: 500; }
        .ai { align-self: flex-start; background: #233554; color: #ccd6f6; border: 1px solid #112240; }

        /* Input */
        #input-area { 
            padding: 15px; display: flex; gap: 8px; background: var(--chat-bg);
            padding-bottom: env(safe-area-inset-bottom, 15px); /* Ajuste para iPhones nuevos */
        }
        input { 
            flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #233554;
            background: #0a192f; color: white; outline: none; font-size: 16px; /* 16px evita zoom automático en iOS */
        }
        button { 
            background: var(--primary); color: #000; border: none; padding: 0 20px;
            border-radius: 25px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ocean" id="ocean"></div>

    <div class="main-container">
        <div id="header">
            <div id="avatar-container">
                <img id="img-A" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
                <img id="img-B" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
                <img id="img-C" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
                <img id="img-D" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
            </div>
        </div>

        <div id="chat-box"></div>

        <div id="input-area">
            <input type="text" id="userInput" placeholder="Escribe aquí..." autocomplete="off">
            <button onclick="hablarConIA()">Enviar</button>
        </div>
    </div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        const imgA = document.getElementById('img-A');
        const imgB = document.getElementById('img-B');
        const imgC = document.getElementById('img-C');
        const imgD = document.getElementById('img-D');
        const sound = document.getElementById('typingSound');
        const chatBox = document.getElementById('chat-box');
        let animando = false;

        // Crear burbujas de fondo
        const ocean = document.getElementById('ocean');
        for (let i = 0; i < 15; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            const size = Math.random() * 30 + 10 + 'px';
            b.style.width = size; b.style.height = size;
            b.style.left = Math.random() * 100 + '%';
            b.style.animationDelay = Math.random() * 10 + 's';
            ocean.appendChild(b);
        }

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        setInterval(() => {
            if (!animando) {
                ocultar(); imgB.style.display = 'block';
                setTimeout(() => { if(!animando){ ocultar(); imgA.style.display = 'block'; } }, 250);
            }
        }, 4000);

        function animarBoca(duracion) {
            animando = true;
            sound.play();
            let ciclo = 0;
            const intervalo = setInterval(() => {
                ocultar();
                if (ciclo % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                ciclo++;
            }, 150);
            setTimeout(() => {
                clearInterval(intervalo);
                animando = false;
                ocultar(); imgA.style.display = 'block';
                sound.pause(); sound.currentTime = 0;
            }, duracion);
        }

        // --- CEREBRO MEJORADO ---
        const respuestas = {
            "hola": "¡Hola! Glub glub. ¿Cómo va tu día hoy?",
            "holi": "¡Holi! Qué alegría verte por aquí.",
            "quien eres": "Soy tu asistente Vaporeon, una criatura de código y burbujas.",
            "como estas": "¡Súper bien! Nadando por el servidor de Vercel muy feliz.",
            "te quiero": "¡Aww! Yo también te quiero mucho. Gracias por programarme.",
            "pokemon": "¡Los tipo agua somos los más elegantes! ¿No crees?",
            "chiste": "¿Qué hace un Vaporeon en el gimnasio? ¡Agua-ntar el peso! Jajaja.",
            "clima": "Aquí en el internet siempre está fresco. ¡Ideal para un tipo agua!",
            "adios": "¡Adiós! No olvides volver pronto para jugar.",
            "help": "Puedes decirme 'hola', 'chiste', 'quién eres' o preguntarme cómo estoy.",
            "creador": "Fui creado por una ingeniera súper talentosa (tú).",
            "comer": "Me encantaría comer una Baya Atrezo digital ahora mismo."
        };

        function hablarConIA() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim().toLowerCase();
            if (!texto) return;

            // Mostrar mensaje del usuario
            chatBox.innerHTML += `<div class="msg user">${input.value}</div>`;
            input.value = "";
            
            // Buscar respuesta
            let respuestaIA = "¡Glub! Eso no lo tengo en mi memoria aún, pero mañana seré más sabio.";
            
            for (let clave in respuestas) {
                if (texto.includes(clave)) {
                    respuestaIA = respuestas[clave];
                    break;
                }
            }

            setTimeout(() => {
                chatBox.innerHTML += `<div class="msg ai">${respuestaIA}</div>`;
                animarBoca(respuestaIA.length * 60);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') hablarConIA(); });
    </script>
</body>
</html>
