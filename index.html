<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente IA</title>
    <style>
        /* Fondo y estructura principal */
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Área del Avatar */
        #top-bar { height: 30%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #252525; border-bottom: 2px solid #6200ee; }
        #avatar-container { width: 120px; height: 120px; position: relative; }
        #avatar-container img { width: 100%; height: 100%; position: absolute; display: none; object-fit: contain; }
        #img-reposo-abiertos { display: block; }

        /* Área del Chat */
        #chat-container { height: 70%; width: 100%; border: none; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Botón invisible sobre el chat para detectar toques */
        #overlay { position: absolute; bottom: 0; width: 100%; height: 100px; z-index: 10; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="avatar-container">
            <!-- 1. CAMBIA ESTOS LINKS POR LOS DE TUS IMÁGENES -->
            <img id="img-reposo-abiertos" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
            <img id="img-reposo-cerrados" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
            <img id="img-hablando-abiertos" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
            <img id="img-hablando-cerrados" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
        </div>
        <small style="margin-top:5px; opacity:0.7;">Asistente en línea</small>
    </div>

    <!-- 2. CAMBIA ESTE LINK POR TU BOT DE POE -->
    <div id="chat-container">
        <iframe src="https://poe.com/KaeAsistente" id="chatFrame"></iframe>
    </div>

    <!-- Capa para detectar cuando tocas para escribir -->
    <div id="overlay" onclick="iniciarAnimacion()"></div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        const imgA = document.getElementById('img-reposo-abiertos');
        const imgB = document.getElementById('img-reposo-cerrados');
        const imgC = document.getElementById('img-hablando-abiertos');
        const imgD = document.getElementById('img-hablando-cerrados');
        const sonido = document.getElementById('typingSound');
        let animando = false;

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        // Parpadeo automático
        setInterval(() => {
            if (!animando) {
                ocultar(); imgB.style.display = 'block';
                setTimeout(() => { if(!animando){ ocultar(); imgA.style.display = 'block'; } }, 200);
            }
        }, 3500);

        // Al tocar el área del chat, el muñeco "habla"
        function iniciarAnimacion() {
            if (animando) return;
            animando = true;
            sonido.play();
            
            let veces = 0;
            const intervalo = setInterval(() => {
                ocultar();
                if (veces % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                veces++;
                
                if (veces > 15) { // Duración de la animación
                    clearInterval(intervalo);
                    animando = false;
                    ocultar();
                    imgA.style.display = 'block';
                }
            }, 150);

            // Quitamos el overlay momentáneamente para que puedan clickear el chat real
            document.getElementById('overlay').style.display = 'none';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'block';
            }, 5000);
        }
    </script>
</body>
</html>
