<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vaporeon Virtual</title>
    <style>
        :root {
            --primary: #00d4ff;
            --bg: #0a192f;
            --chat-bg: #112240;
        }

        /* Reset total para evitar errores en móvil */
        * { box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: white; font-family: sans-serif;
            overflow: hidden; position: fixed; /* Evita que la pantalla rebote */
        }

        /* Fondo de Burbujas - Capa de atrás */
        .ocean {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; /* Al fondo */
            background: linear-gradient(180deg, #0a192f 0%, #001f3f 100%);
        }

        .bubble {
            position: absolute; bottom: -50px; background: rgba(255, 255, 255, 0.1);
            border-radius: 50%; animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        /* Contenedor Principal - Capa de adelante */
        .main-container {
            position: relative; z-index: 10; /* Adelante de las burbujas */
            display: flex; flex-direction: column; height: 100vh; width: 100%;
        }

        /* Avatar */
        #header { 
            height: 30vh; min-height: 150px;
            display: flex; align-items: center; justify-content: center;
        }
        #avatar-container { width: 140px; height: 140px; position: relative; }
        #avatar-container img { width: 100%; height: 100%; position: absolute; display: none; object-fit: contain; }
        #img-A { display: block; }

        /* Chat */
        #chat-box { 
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
            background: rgba(17, 34, 64, 0.85);
            border-radius: 25px 25px 0 0;
            backdrop-filter: blur(5px);
            margin: 0 5px;
        }

        .msg { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 15px; }
        .user { align-self: flex-end; background: var(--primary); color: #000; }
        .ai { align-self: flex-start; background: #233554; color: #ccd6f6; }

        /* INPUT AREA - Ajuste crítico */
        #input-area { 
            height: 70px; /* Tamaño fijo para que no desaparezca */
            padding: 10px 15px; 
            display: flex; 
            gap: 10px; 
            background: #112240;
            z-index: 20;
            border-top: 1px solid var(--primary);
        }
        
        input { 
            flex: 1; padding: 0 15px; border-radius: 25px; border: none;
            background: #0a192f; color: white; outline: none; font-size: 16px;
            height: 45px;
        }
        
        button { 
            background: var(--primary); color: #000; border: none; 
            padding: 0 20px; border-radius: 25px; font-weight: bold;
            height: 45px;
        }
    </style>
</head>
<body>

    <div class="ocean" id="ocean"></div>

    <div class="main-container">
        <div id="header">
            <div id="avatar-container">
                <img id="img-A" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
                <img id="img-B" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
                <img id="img-C" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
                <img id="img-D" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
            </div>
        </div>

        <div id="chat-box"></div>

        <div id="input-area">
            <input type="text" id="userInput" placeholder="Escribe aquí..." autocomplete="off">
            <button onclick="hablarConIA()">Enviar</button>
        </div>
    </div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        const imgA = document.getElementById('img-A');
        const imgB = document.getElementById('img-B');
        const imgC = document.getElementById('img-C');
        const imgD = document.getElementById('img-D');
        const chatBox = document.getElementById('chat-box');
        const sound = document.getElementById('typingSound');
        let animando = false;

        // Crear burbujas
        const ocean = document.getElementById('ocean');
        for (let i = 0; i < 12; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            const size = Math.random() * 25 + 10 + 'px';
            b.style.width = size; b.style.height = size;
            b.style.left = Math.random() * 100 + '%';
            b.style.animationDelay = Math.random() * 8 + 's';
            ocean.appendChild(b);
        }

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        setInterval(() => {
            if (!animando) {
                ocultar(); imgB.style.display = 'block';
                setTimeout(() => { if(!animando){ ocultar(); imgA.style.display = 'block'; } }, 200);
            }
        }, 4000);

        function animarBoca(duracion) {
            animando = true;
            sound.play();
            let ciclo = 0;
            const intervalo = setInterval(() => {
                ocultar();
                if (ciclo % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                ciclo++;
            }, 150);
            setTimeout(() => {
                clearInterval(intervalo);
                animando = false;
                ocultar(); imgA.style.display = 'block';
                sound.pause(); sound.currentTime = 0;
            }, duracion);
        }

        const respuestas = {
            "hola": "¡Hola! Glub glub. ¿Cómo va tu día hoy?",
            "holi": "¡Holi! Qué alegría verte por aquí.",
            "quien eres": "Soy tu asistente Vaporeon, una criatura de código y burbujas.",
            "como estas": "¡Súper bien! Nadando por el servidor de Vercel muy feliz.",
            "te quiero": "¡Aww! Yo también te quiero mucho. Gracias por programarme.",
            "pokemon": "¡Los tipo agua somos los más elegantes! ¿No crees?",
            "chiste": "¿Qué hace un Vaporeon en el gimnasio? ¡Agua-ntar el peso! Jajaja.",
            "clima": "Aquí en el internet siempre está fresco. ¡Ideal para un tipo agua!",
            "adios": "¡Adiós! No olvides volver pronto para jugar.",
            "help": "Puedes decirme 'hola', 'chiste', 'quién eres' o preguntarme cómo estoy.",
            "creador": "Fui creado por una ingeniera súper talentosa (tú).",
            "comer": "Me encantaría comer una Baya Atrezo digital ahora mismo."
         };

        async function hablarConIA() {
    const input = document.getElementById('userInput');
    const textoOriginal = input.value;
    const textoLimpio = textoOriginal.trim().toLowerCase();
    if (!textoOriginal) return;

    chatBox.innerHTML += `<div class="msg user">${textoOriginal}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
    
    let respuestaIA = null;
    for (let clave in respuestas) {
        if (textoLimpio.includes(clave)) {
            respuestaIA = respuestas[clave];
            break;
        }
    }

    if (!respuestaIA) {
        animarBoca(2000);
        chatBox.innerHTML += `<div class="msg ai">¡Glub! Déjame buscar eso en el océano de información...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // PASO 1: Buscar el título más relevante en Wikipedia
            const searchUrl = `https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(textoOriginal)}&format=json&origin=*`;
            const searchRes = await fetch(searchUrl);
            const searchData = await searchRes.json();

            if (searchData.query.search.length > 0) {
                const mejorTitulo = searchData.query.search[0].title;
                
                // PASO 2: Traer el resumen de ese título
                const summaryUrl = `https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(mejorTitulo)}`;
                const summaryRes = await fetch(summaryUrl);
                const summaryData = await summaryRes.json();

                if (summaryData.extract) {
                    respuestaIA = "Encontré algo sobre <b style='color: #00d4ff;'>${mejorTitulo}</b>: ${summaryData.extract}";
                }
            }
            
            if (!respuestaIA) {
                respuestaIA = "Mis burbujas no encontraron nada exacto. ¿Puedes intentar con otra palabra?";
            }

        } catch (e) {
            respuestaIA = "¡Glub! Hubo un remolino en la conexión. Intenta de nuevo.";
        }
    }

    setTimeout(() => {
        chatBox.innerHTML += `<div class="msg ai">${respuestaIA}</div>`;
        animarBoca(respuestaIA.length * 50);
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 1000);
}

        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') hablarConIA(); });
    </script>
</body>
</html>
