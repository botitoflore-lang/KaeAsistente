<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vaporeon Virtual Pro</title>
    <style>
        :root {
            --primary: #00d4ff;
            --bg: #0a192f;
            --chat-bg: #112240;
        }

        * { box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: white; font-family: sans-serif;
            overflow: hidden; position: fixed;
        }

        /* Fondo de Burbujas */
        .ocean {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1;
            background: linear-gradient(180deg, #0a192f 0%, #001f3f 100%);
        }

        .bubble {
            position: absolute; bottom: -50px; background: rgba(255, 255, 255, 0.1);
            border-radius: 50%; animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        /* Estructura Principal */
        .main-container {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; height: 100vh; width: 100%;
        }

        #header { 
            height: 30vh; min-height: 150px;
            display: flex; align-items: center; justify-content: center;
        }

        #avatar-container { width: 140px; height: 140px; position: relative; filter: drop-shadow(0 0 10px var(--primary)); }
        #avatar-container img { width: 100%; height: 100%; position: absolute; display: none; object-fit: contain; }
        #img-A { display: block; }

        #chat-box { 
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
            background: rgba(17, 34, 64, 0.85);
            border-radius: 25px 25px 0 0;
            backdrop-filter: blur(5px);
            margin: 0 5px;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .msg { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: var(--primary); color: #000; font-weight: bold; }
        .ai { align-self: flex-start; background: #233554; color: #ccd6f6; border: 1px solid #30363d; }

        #input-area { 
            height: 70px; padding: 10px 15px; display: flex; gap: 10px; 
            background: #112240; z-index: 20; border-top: 1px solid var(--primary);
        }
        
        input { 
            flex: 1; padding: 0 15px; border-radius: 25px; border: none;
            background: #0a192f; color: white; outline: none; font-size: 16px;
        }
        
        button { 
            background: var(--primary); color: #000; border: none; 
            padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ocean" id="ocean"></div>

    <div class="main-container">
        <div id="header">
            <div id="avatar-container">
                <img id="img-A" src="https://i.ibb.co/HpnNTw8H/19-sin-t-tulo-20260508010017.png">
                <img id="img-B" src="https://i.ibb.co/Lz8S5FX1/19-sin-t-tulo-20260508005934.png">
                <img id="img-C" src="https://i.ibb.co/5WsbCWGg/19-sin-t-tulo-20260508010236.png">
                <img id="img-D" src="https://i.ibb.co/TD8ZKBhb/19-sin-t-tulo-20260508010100.png">
            </div>
        </div>

        <div id="chat-box"></div>

        <div id="input-area">
            <input type="text" id="userInput" placeholder="Traduce: hola / clima / ¿Qué es...?" autocomplete="off">
            <button onclick="hablarConIA()">Enviar</button>
        </div>
    </div>

    <audio id="typingSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>

    <script>
        const imgA = document.getElementById('img-A');
        const imgB = document.getElementById('img-B');
        const imgC = document.getElementById('img-C');
        const imgD = document.getElementById('img-D');
        const chatBox = document.getElementById('chat-box');
        const sound = document.getElementById('typingSound');
        let animando = false;

        // --- BURBUJAS ---
        const ocean = document.getElementById('ocean');
        for (let i = 0; i < 15; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            const size = Math.random() * 25 + 10 + 'px';
            b.style.width = size; b.style.height = size;
            b.style.left = Math.random() * 100 + '%';
            b.style.animationDelay = Math.random() * 8 + 's';
            ocean.appendChild(b);
        }

        // --- VOZ ---
        function decir(texto) {
            const textoLimpio = texto.replace(/<[^>]*>?/gm, '');
            const mensaje = new SpeechSynthesisUtterance(textoLimpio);
            mensaje.lang = 'es-ES'; 
            mensaje.rate = 1.1; 
            mensaje.pitch = 1.2; 
            window.speechSynthesis.speak(mensaje);
        }

        function ocultar() { [imgA, imgB, imgC, imgD].forEach(i => i.style.display = 'none'); }

        // Parpadeo
        setInterval(() => {
            if (!animando) {
                ocultar(); imgB.style.display = 'block';
                setTimeout(() => { if(!animando){ ocultar(); imgA.style.display = 'block'; } }, 200);
            }
        }, 4000);

        function animarBoca(duracion) {
            animando = true;
            sound.play();
            let ciclo = 0;
            const intervalo = setInterval(() => {
                ocultar();
                if (ciclo % 2 === 0) imgC.style.display = 'block';
                else imgD.style.display = 'block';
                ciclo++;
            }, 150);
            setTimeout(() => {
                clearInterval(intervalo);
                animando = false;
                ocultar(); imgA.style.display = 'block';
                sound.pause(); sound.currentTime = 0;
            }, duracion);
        }

        const respuestasLocales = {
            "hola": "¡Hola! Glub glub. ¿Cómo va tu día?",
            "quien eres": "Soy tu asistente Vaporeon. ¡Listo para ayudarte!",
            "te quiero": "¡Y yo a ti! Gracias por cuidarme tanto.",
            "como estas": "Muy feliz nadando en tu computadora.",
            "pokemon": "¡Los tipo agua somos los más fuertes!"
        };

        async function hablarConIA() {
            const input = document.getElementById('userInput');
            const textoOriginal = input.value.trim();
            const textoLimpio = textoOriginal.toLowerCase();
            if (!textoOriginal) return;

            chatBox.innerHTML += `<div class="msg user">${textoOriginal}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            
            let respuestaIA = null;

            // 1. COMANDO TRADUCIR
            if (textoLimpio.startsWith("traduce:")) {
                const palabra = textoLimpio.replace("traduce:", "").trim();
                animarBoca(1500);
                try {
                    const res = await fetch(`https://api.mymemory.translated.net/get?q=${palabra}&langpair=es|en`);
                    const data = await res.json();
                    respuestaIA = `En inglés se dice: ${data.responseData.translatedText}`;
                } catch (e) { respuestaIA = "Me dio un calambre en la lengua y no pude traducir."; }
            }

            // 2. COMANDO CLIMA
            else if (textoLimpio.includes("clima") || textoLimpio.includes("tiempo")) {
                animarBoca(2000);
                try {
                    const res = await fetch('https://wttr.in/?format=j1');
                    const data = await res.json();
                    const temp = data.current_condition[0].temp_C;
                    const desc = data.current_condition[0].lang_es[0].value;
                    respuestaIA = `Ahora mismo hay ${temp}°C y está ${desc}. ¡Glub!`;
                } catch (e) { respuestaIA = "No puedo ver el cielo desde el fondo del mar."; }
            }

            // 3. RESPUESTAS LOCALES
            if (!respuestaIA) {
                for (let clave in respuestasLocales) {
                    if (textoLimpio.includes(clave)) {
                        respuestaIA = respuestasLocales[clave];
                        break;
                    }
                }
            }

            // 4. WIKIPEDIA (Plan Final)
            if (!respuestaIA) {
                animarBoca(2000);
                chatBox.innerHTML += `<div class="msg ai">Buscando en mis burbujas...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                try {
                    const searchUrl = `https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(textoOriginal)}&format=json&origin=*`;
                    const searchRes = await fetch(searchUrl);
                    const searchData = await searchRes.json();
                    if (searchData.query.search.length > 0) {
                        const mejorTitulo = searchData.query.search[0].title;
                        const summaryUrl = `https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(mejorTitulo)}`;
                        const summaryRes = await fetch(summaryUrl);
                        const summaryData = await summaryRes.json();
                        respuestaIA = summaryData.extract || "No encontré un resumen claro.";
                    }
                } catch (e) { respuestaIA = "Se me revolvió el agua y no encontré nada."; }
            }

            if (!respuestaIA) respuestaIA = "¡Glub! No sé qué es eso. ¿Me enseñas?";

            // MOSTRAR Y HABLAR
            setTimeout(() => {
                chatBox.innerHTML += `<div class="msg ai">${respuestaIA}</div>`;
                decir(respuestaIA);
                animarBoca(respuestaIA.length * 60);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') hablarConIA(); });
    </script>
</body>
</html>
